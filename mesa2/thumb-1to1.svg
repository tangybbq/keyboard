<text x="10" y="12" font-family="sans-serif" font-size="5">mesa2 - thumb angle and reach, LEFT hand, hand-local</text>
<rect x="10" y="16" width="100" height="7" fill="none" stroke="#c00" stroke-width="0.25"/>
<text x="112" y="21" font-family="sans-serif" font-size="3" fill="#c00">100.0 mm - print at 100%, no fit-to-page</text>
<text x="10" y="30" font-family="sans-serif" font-size="3.1" fill="#333">Within a row only the ANGLE of the line through the two thumb keys changes.</text>
<text x="10" y="34.2" font-family="sans-serif" font-size="3.1" fill="#333">Between rows only the REACH changes. The index column is redrawn in each cell so the</text>
<text x="10" y="38.400000000000006" font-family="sans-serif" font-size="3.1" fill="#333">distance from finger to thumb is identical across a row - register your index on it every time.</text>
<text x="10" y="42.60000000000001" font-family="sans-serif" font-size="3.1" fill="#333">Lay the thumb across a pair: the right one is reached without moving the wrist and lands</text>
<text x="10" y="46.80000000000001" font-family="sans-serif" font-size="3.1" fill="#333">square on both keys. If none fits, use measure-blank.svg - sweep and tap 4-5 dots on the arc.</text>
