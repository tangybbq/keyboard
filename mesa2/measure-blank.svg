<svg xmlns="http://www.w3.org/2000/svg" width="196mm" height="268mm" viewBox="0 0 196 268">
<rect width="100%" height="100%" fill="white"/>
<text x="8.0" y="12" font-family="sans-serif" font-size="5">mesa2 - hand measurement sheet (LEFT hand; mirror for right)</text>
<rect x="8.0" y="16" width="100" height="7" fill="none" stroke="#c00" stroke-width="0.25"/>
<text x="110.0" y="21" font-family="sans-serif" font-size="3" fill="#c00">100.0 mm - print at 100%, no scaling</text>
<text x="8.0" y="30" font-family="sans-serif" font-size="3.1" fill="#333">1. Tape this down. Sit as you type. The datum line at the bottom goes parallel to the desk edge.</text>
<text x="8.0" y="34.2" font-family="sans-serif" font-size="3.1" fill="#333">2. Ink the pad of each fingertip (washable marker). Do NOT hold a pen - it changes the whole posture.</text>
<text x="8.0" y="38.400000000000006" font-family="sans-serif" font-size="3.1" fill="#333">3. Rest the hand naturally, then TAP each finger straight down. That is the home row. Label the dots.</text>
<text x="8.0" y="42.60000000000001" font-family="sans-serif" font-size="3.1" fill="#333">4. Curl each finger one row further and tap again. Two dots per finger = the column&#x27;s direction.</text>
<text x="8.0" y="46.80000000000001" font-family="sans-serif" font-size="3.1" fill="#333">   The line through a finger&#x27;s two dots IS its splay angle. That is the measurement worth having.</text>
<text x="8.0" y="51.000000000000014" font-family="sans-serif" font-size="3.1" fill="#333">5. Thumb: sweep it through its comfortable arc and tap 4-5 times along the way. Do not aim for a line -</text>
<text x="8.0" y="55.20000000000002" font-family="sans-serif" font-size="3.1" fill="#333">   the thumb pivots at the base, so those dots fall on an arc, and the arc gives both angle and distance.</text>
<text x="8.0" y="59.40000000000002" font-family="sans-serif" font-size="3.1" fill="#333">6. Mark where the heel of your palm rests. Repeat the whole thing twice more on fresh sheets.</text>
