<text x="112" y="21" font-family="sans-serif" font-size="3" fill="#c00">100.0 mm - print at 100%, no fit-to-page</text>
<text x="10" y="30" font-family="sans-serif" font-size="3.1" fill="#333">Columns are anchored and splayed about their CENTRE - the point the finger rests on between</text>
<text x="10" y="34.2" font-family="sans-serif" font-size="3.1" fill="#333">the two keys - not about either key. Rest a finger on the ridge between a column&#x27;s two caps.</text>
<text x="10" y="38.400000000000006" font-family="sans-serif" font-size="3.1" fill="#333">Both are chouchou with your corrections applied, bracketing the amount: spread down, pinky and</text>
<text x="10" y="42.60000000000001" font-family="sans-serif" font-size="3.1" fill="#333">index staggered toward the palm, pinky rotated harder. 1u caps. Thumb pairs are placeholders -</text>
<text x="10" y="46.80000000000001" font-family="sans-serif" font-size="3.1" fill="#333">use thumb-1to1 for those. You already have chouchou printed; compare against that.</text>
