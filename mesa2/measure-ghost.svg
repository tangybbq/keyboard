<text x="8.0" y="30" font-family="sans-serif" font-size="3.1" fill="#333">Chouchou&#x27;s 10 left-hand keys, drawn 1:1 with its unibody angle removed (hand-local frame).</text>
<text x="8.0" y="34.2" font-family="sans-serif" font-size="3.1" fill="#333">This is the layout you already printed - use it to mark CORRECTIONS rather than absolute positions.</text>
<text x="8.0" y="38.400000000000006" font-family="sans-serif" font-size="3.1" fill="#333">1. Tape down. Ink the fingertips. Rest the hand over the ghosted keys as if typing, and tap.</text>
<text x="8.0" y="42.60000000000001" font-family="sans-serif" font-size="3.1" fill="#333">2. Where each dot falls relative to its cap centre is the correction, read straight off the grid.</text>
<text x="8.0" y="46.80000000000001" font-family="sans-serif" font-size="3.1" fill="#333">3. For the thumbs, tap the comfortable arc rather than aiming at the two drawn keys.</text>
<text x="8.0" y="51.000000000000014" font-family="sans-serif" font-size="3.1" fill="#333">Cap centres in this sheet&#x27;s grid coordinates are listed in CHOUCHOU.md. Leave the palm area below clear.</text>
