<svg xmlns="http://www.w3.org/2000/svg" width="258mm" height="196mm" viewBox="0 0 258 196">
<rect width="100%" height="100%" fill="white"/>
<text x="9" y="10" font-family="sans-serif" font-size="4.6">mesa2 - two-hand measurement sheet</text>
<rect x="9" y="13" width="100" height="6" fill="none" stroke="#c00" stroke-width="0.25"/>
<text x="111" y="17.5" font-family="sans-serif" font-size="3" fill="#c00">100.0 mm - print at 100%, no scaling, LANDSCAPE</text>
<text x="9" y="23" font-family="sans-serif" font-size="2.85" fill="#333">Both hands down as you would type, paper taped and NOT moved for the whole session. No desk-edge datum is needed: the</text>
<text x="9" y="26.6" font-family="sans-serif" font-size="2.85" fill="#333">angle between your two hands IS the unibody angle, so it is internal to this sheet as long as the paper never moves.</text>
<text x="9" y="30.200000000000003" font-family="sans-serif" font-size="2.85" fill="#333">Steno rest position: each finger sits BETWEEN its two keys, not on one of them. Mark three dots per finger -</text>
<text x="9" y="33.800000000000004" font-family="sans-serif" font-size="2.85" fill="#333">(a) where it rests, (b) rocked forward, (c) rocked back. (a) is the column centre and (b)-(c) give the column ANGLE.</text>
<text x="9" y="37.400000000000006" font-family="sans-serif" font-size="2.85" fill="#333">Do not try to set the row pitch from (b) and (c): it is fixed at 17 mm by the caps. Only note if the rock feels SHORT.</text>
<text x="9" y="41.00000000000001" font-family="sans-serif" font-size="2.85" fill="#333">Keep the hand PLANTED and lift one finger at a time; the others hold the posture. Mark with a pen in the other hand.</text>
<text x="9" y="44.60000000000001" font-family="sans-serif" font-size="2.85" fill="#333">Thumbs: sweep the comfortable arc and mark 4-5 spots along it - an arc, not two aimed dots. Then mark both palm heels.</text>
<text x="9" y="48.20000000000001" font-family="sans-serif" font-size="2.85" fill="#333">Do the left hand this way, then re-place BOTH hands naturally and do the right. Re-placing both is what keeps the angle honest.</text>
